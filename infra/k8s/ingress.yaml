apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eeetik-api-ingress
  namespace: eeetik
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  rules:
    - host: api.eeetik.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eeetik-api
                port:
                  number: 80
  tls:
    - hosts:
        - api.eeetik.app
      secretName: eeetik-api-tls
