apiVersion: apps/v1
kind: Deployment
metadata:
  name: eeetik-worker
  namespace: eeetik-backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: eeetik-worker
  template:
    metadata:
      labels:
        app: eeetik-worker
    spec:
      containers:
        - name: worker
          image: bif12/eeetik-backend-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: eeetik-backend-config
            - secretRef:
                name: eeetik-backend-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi

