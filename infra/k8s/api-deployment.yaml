apiVersion: apps/v1
kind: Deployment
metadata:
  name: eeetik-api
  namespace: eeetik-backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: eeetik-api
  template:
    metadata:
      labels:
        app: eeetik-api
    spec:
      containers:
        - name: api
          image: ghcr.io/<owner>/eeetik-backend-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: eeetik-backend-config
            - secretRef:
                name: eeetik-backend-secret
          readinessProbe:
            httpGet:
              path: /api/v2/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v2/health/live
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

